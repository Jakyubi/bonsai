<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>about</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- ABOUT HERO SECTION -->
    <section class="relative flex w-full flex-col overflow-hidden bg-black xl:flex-row">
      <!-- Background Image -->
      <div class="absolute inset-0 z-0">
        <img
          src="/src/assets/photos/zdjecie-3.png"
          alt="Igły sosny Bonsai"
          class="h-full w-full object-cover opacity-60" />
        <div class="absolute inset-0 bg-gradient-to-r from-black/50 to-transparent"></div>
      </div>

      <!-- Left side -->
      <div
        class="relative z-10 flex w-full shrink-0 items-center justify-center gap-3 border-b border-white/20 bg-black/20 px-4 py-4 backdrop-blur-md xl:w-50 xl:flex-col xl:border-r xl:border-b-0 xl:py-6"></div>

      <!-- Main Content Container -->
      <div
        class="relative z-10 flex flex-1 flex-col justify-center px-6 py-24 sm:px-12 md:py-32 lg:px-20 xl:py-52 xl:pr-16 xl:pl-32">
        <div class="flex flex-col">
          <!-- Title -->
          <h1 class="text-5xl leading-tight font-light tracking-wide text-white sm:text-6xl md:text-7xl xl:text-8xl">
            Szkółka<br />
            Bonsai Park
          </h1>

          <!-- Subtitle -->
          <div class="mt-12 sm:mt-16 xl:mt-20 xl:pb-32 xl:pl-72">
            <p
              class="text-xl leading-relaxed font-normal tracking-wide text-white sm:text-2xl md:text-5xl xl:leading-snug">
              Nasz zespół łączy pasja i miłość<br class="hidden sm:block" />
              do Bonsai.
            </p>
          </div>
        </div>
      </div>
    </section>
    <script type="module" src="/src/main.js"></script>

    <br />
    <br />
    <br />
    <br />
  </body>
</html>
