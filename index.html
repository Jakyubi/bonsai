<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bonsai</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <!-- HEADER -->
    <header x-data="{ open: false }" class="relative w-full bg-white border-b border-gray-100 z-50">
      <!-- Main Container -->
      <div class="max-w-[1920px] mx-auto px-4 sm:px-8 xl:px-12 h-20 flex items-center justify-between">
        <!-- Logo  -->
        <a href="#" class="flex items-center shrink-0">
          <img src="/src/assets/logo/logo-1.png" alt="Japanese Garden" class="h-10 w-auto" />
        </a>

        <div class="hidden lg:flex items-center gap-10 2xl:gap-16 ml-auto">
          <!-- Desktop nav -->
          <nav class="hidden lg:flex items-center gap-8 xl:gap-14 text-sm font-light text-bonsai-dark tracking-wide">
            <a href="#" class="hover:text-gray-500 transition-colors duration-200">Home</a>
            <a href="#" class="hover:text-gray-500 transition-colors duration-200">O nas</a>
            <a href="#" class="hover:text-gray-500 transition-colors duration-200">Bonsai</a>
            <a href="#" class="hover:text-gray-500 transition-colors duration-200">Rośliny</a>
            <a href="#" class="hover:text-gray-500 transition-colors duration-200">Realizacje</a>
            <a href="#" class="hover:text-gray-500 transition-colors duration-200">Kontakt</a>
          </nav>

          <!-- Action buttons -->
          <div class="flex items-center gap-3 xl:gap-4 shrink-0">
            <a
              href="#"
              class="px-6 py-2 xl:text-sm font-light text-bonsai-dark border border-bonsai-dark rounded-full hover:bg-bonsai-dark hover:text-white transition-all duration-300 whitespace-nowrap">
              Jak dojechać?
            </a>
            <a
              href="#"
              class="px-6 py-2 xl:text-sm font-light text-bonsai-dark border border-bonsai-dark rounded-full hover:bg-bonsai-dark hover:text-white transition-all duration-300 whitespace-nowrap">
              Katalog roślin
            </a>
          </div>
        </div>

        <!-- Mobile menu open button -->
        <button @click="open = !open" type="button" class="lg:hidden p-2 text-bonsai-dark focus:outline-none ml-auto">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              x-show="!open"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M4 6h16M4 12h16M4 18h16" />
            <path
              x-show="open"
              x-cloak
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Mobile menu -->
      <div
        x-show="open"
        x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0 -translate-y-2"
        x-transition:enter-end="opacity-100 translate-y-0"
        x-transition:leave="transition ease-in duration-150"
        x-transition:leave-start="opacity-100 translate-y-0"
        x-transition:leave-end="opacity-0 -translate-y-2"
        @click.away="open = false"
        class="lg:hidden absolute top-full left-0 w-full bg-white border-b border-gray-200 px-6 pt-2 pb-6 space-y-3 shadow-lg z-50">
        <nav class="space-y-1">
          <a
            href="#"
            class="block py-3 px-2 text-lg font-light text-bonsai-dark text-center hover:bg-gray-50 rounded-lg transition-colors duration-150 active:bg-gray-100 active:text-black focus:outline-none focus:bg-gray-100"
            >Home</a
          >
          <a
            href="#"
            class="block py-3 px-2 text-lg font-light text-bonsai-dark text-center hover:bg-gray-50 rounded-lg transition-colors duration-150 active:bg-gray-100 active:text-black focus:outline-none focus:bg-gray-100"
            >O nas</a
          >
          <a
            href="#"
            class="block py-3 px-2 text-lg font-light text-bonsai-dark text-center hover:bg-gray-50 rounded-lg transition-colors duration-150 active:bg-gray-100 active:text-black focus:outline-none focus:bg-gray-100"
            >Bonsai</a
          >
          <a
            href="#"
            class="block py-3 px-2 text-lg font-light text-bonsai-dark text-center hover:bg-gray-50 rounded-lg transition-colors duration-150 active:bg-gray-100 active:text-black focus:outline-none focus:bg-gray-100"
            >Rośliny</a
          >
          <a
            href="#"
            class="block py-3 px-2 text-lg font-light text-bonsai-dark text-center hover:bg-gray-50 rounded-lg transition-colors duration-150 active:bg-gray-100 active:text-black focus:outline-none focus:bg-gray-100"
            >Realizacje</a
          >
          <a
            href="#"
            class="block py-3 px-2 text-lg font-light text-bonsai-dark text-center hover:bg-gray-50 rounded-lg transition-colors duration-150 active:bg-gray-100 active:text-black focus:outline-none focus:bg-gray-100"
            >Kontakt</a
          >
        </nav>

        <div class="pt-4 border-t border-gray-100 flex flex-col sm:flex-row gap-3">
          <a
            href="#"
            class="w-full text-center py-3 text-base font-light text-bonsai-dark border border-bonsai-dark rounded-full transition-all duration-150 active:bg-bonsai-dark active:text-white focus:bg-bonsai-dark focus:text-white focus:outline-none">
            Jak dojechać?
          </a>
          <a
            href="#"
            class="w-full text-center py-3 text-base font-light text-bonsai-dark border border-bonsai-dark rounded-full transition-all duration-150 active:bg-bonsai-dark active:text-white focus:bg-bonsai-dark focus:text-white focus:outline-none">
            Katalog roślin
          </a>
        </div>
      </div>
    </header>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
