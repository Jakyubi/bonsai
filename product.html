<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>product</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- HEADER -->
    <header x-data="{ open: false }" class="relative z-50 w-full border-b border-gray-100 bg-white">
      <!-- Main Container -->
      <div class="mx-auto flex h-20 max-w-[1920px] items-center justify-between px-4 sm:px-8">
        <!-- Logo  -->
        <a href="#" class="flex shrink-0 items-center">
          <img src="/src/assets/logo/logo-1.png" alt="Japanese Garden" class="h-10 w-auto" />
        </a>

        <div class="ml-auto hidden items-center gap-10 lg:flex 2xl:gap-16">
          <!-- Desktop nav -->
          <nav
            class="text-bonsai-dark hidden items-center gap-8 text-sm font-light tracking-wide lg:flex xl:mr-8 xl:gap-18">
            <a href="#" class="transition-colors duration-200 hover:text-gray-500">Home</a>
            <a href="#" class="transition-colors duration-200 hover:text-gray-500">O nas</a>
            <a href="#" class="transition-colors duration-200 hover:text-gray-500">Bonsai</a>
            <a href="#" class="transition-colors duration-200 hover:text-gray-500">Rośliny</a>
            <a href="#" class="transition-colors duration-200 hover:text-gray-500">Realizacje</a>
            <a href="#" class="transition-colors duration-200 hover:text-gray-500">Kontakt</a>
          </nav>

          <!-- Action buttons -->
          <div class="flex shrink-0 items-center gap-3 xl:gap-4">
            <a
              href="#"
              class="text-bonsai-dark border-bonsai-dark hover:bg-bonsai-dark rounded-full border px-6 py-2 font-light whitespace-nowrap transition-all duration-300 hover:text-white xl:text-sm">
              Jak dojechać?
            </a>
            <a
              href="/product.html"
              class="text-bonsai-dark border-bonsai-dark hover:bg-bonsai-dark rounded-full border px-6 py-2 font-light whitespace-nowrap transition-all duration-300 hover:text-white xl:text-sm">
              Katalog roślin
            </a>
          </div>
        </div>

        <!-- Mobile menu open button -->
        <button @click="open = !open" type="button" class="text-bonsai-dark ml-auto p-2 focus:outline-none lg:hidden">
          <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              x-show="!open"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M4 6h16M4 12h16M4 18h16" />
            <path
              x-show="open"
              x-cloak
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Mobile menu -->
      <div
        x-show="open"
        x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0 -translate-y-2"
        x-transition:enter-end="opacity-100 translate-y-0"
        x-transition:leave="transition ease-in duration-150"
        x-transition:leave-start="opacity-100 translate-y-0"
        x-transition:leave-end="opacity-0 -translate-y-2"
        @click.away="open = false"
        class="absolute top-full left-0 z-50 w-full space-y-3 border-b border-gray-200 bg-white px-6 pt-2 pb-6 shadow-lg lg:hidden">
        <nav class="space-y-1">
          <a
            href="#"
            class="text-bonsai-dark block rounded-lg px-2 py-3 text-center text-lg font-light transition-colors duration-150 hover:bg-gray-50 focus:bg-gray-100 focus:outline-none active:bg-gray-100 active:text-black"
            >Home</a
          >
          <a
            href="#"
            class="text-bonsai-dark block rounded-lg px-2 py-3 text-center text-lg font-light transition-colors duration-150 hover:bg-gray-50 focus:bg-gray-100 focus:outline-none active:bg-gray-100 active:text-black"
            >O nas</a
          >
          <a
            href="#"
            class="text-bonsai-dark block rounded-lg px-2 py-3 text-center text-lg font-light transition-colors duration-150 hover:bg-gray-50 focus:bg-gray-100 focus:outline-none active:bg-gray-100 active:text-black"
            >Bonsai</a
          >
          <a
            href="#"
            class="text-bonsai-dark block rounded-lg px-2 py-3 text-center text-lg font-light transition-colors duration-150 hover:bg-gray-50 focus:bg-gray-100 focus:outline-none active:bg-gray-100 active:text-black"
            >Rośliny</a
          >
          <a
            href="#"
            class="text-bonsai-dark block rounded-lg px-2 py-3 text-center text-lg font-light transition-colors duration-150 hover:bg-gray-50 focus:bg-gray-100 focus:outline-none active:bg-gray-100 active:text-black"
            >Realizacje</a
          >
          <a
            href="#"
            class="text-bonsai-dark block rounded-lg px-2 py-3 text-center text-lg font-light transition-colors duration-150 hover:bg-gray-50 focus:bg-gray-100 focus:outline-none active:bg-gray-100 active:text-black"
            >Kontakt</a
          >
        </nav>

        <div class="flex flex-col gap-3 border-t border-gray-100 pt-4 sm:flex-row">
          <a
            href="#"
            class="text-bonsai-dark border-bonsai-dark active:bg-bonsai-dark focus:bg-bonsai-dark w-full rounded-full border py-3 text-center text-base font-light transition-all duration-150 focus:text-white focus:outline-none active:text-white">
            Jak dojechać?
          </a>
          <a
            href="#"
            class="text-bonsai-dark border-bonsai-dark active:bg-bonsai-dark focus:bg-bonsai-dark w-full rounded-full border py-3 text-center text-base font-light transition-all duration-150 focus:text-white focus:outline-none active:text-white">
            Katalog roślin
          </a>
        </div>
      </div>
    </header>

    <!-- CATEGORIES BAR -->
    <section x-data="categoriesBar" class="relative w-full border-b border-gray-100 bg-white">
      <div class="relative mx-auto flex h-20 max-w-[1920px] items-center md:h-24">
        <!-- List container -->
        <div
          x-ref="scrollContainer"
          x-init="checkScroll()"
          @scroll.debounce.50ms="checkScroll()"
          class="hide-scrollbar flex h-full min-w-0 flex-1 items-center overflow-x-auto scroll-smooth">
          <template x-for="(cat, index) in categories" :key="index">
            <a
              :href="cat.link"
              class="group flex h-full shrink-0 items-center justify-center gap-5 border-r border-gray-100 px-8 transition-colors first:border-l hover:bg-gray-50/80">
              <!-- Image -->
              <div class="flex h-14 w-14 shrink-0 items-center justify-center overflow-hidden">
                <img
                  :src="cat.image"
                  :alt="cat.name"
                  class="max-h-full max-w-full object-contain transition-transform duration-300 group-hover:scale-105" />
              </div>

              <!-- Text -->
              <span
                class="text-bonsai-dark text-xs leading-tight font-light tracking-wide whitespace-pre-line transition-colors group-hover:text-black sm:text-sm"
                x-text="cat.name">
              </span>
            </a>
          </template>
        </div>

        <!-- Scroll Left Button -->
        <div
          x-show="canScrollLeft"
          x-transition:enter="transition opacity duration-300"
          x-transition:enter-start="opacity-0"
          x-transition:enter-end="opacity-100"
          x-transition:leave="transition opacity duration-300"
          x-transition:leave-start="opacity-100"
          x-transition:leave-end="opacity-0"
          class="pointer-events-none absolute top-0 bottom-0 left-0 z-10 hidden w-32 items-center justify-start bg-gradient-to-r from-white via-white/90 to-transparent pl-4 sm:w-40 md:flex">
          <button
            @click="scrollLeft()"
            type="button"
            aria-label="Przewiń kategorie w lewo"
            class="group pointer-events-auto flex h-9 w-9 items-center justify-center transition-transform duration-200 hover:scale-105">
            <img
              src="/src/assets/icons/icon-arrow.svg"
              alt=""
              class="h-9 w-9 -rotate-135 invert transition-all duration-200 group-hover:opacity-80" />
          </button>
        </div>

        <!-- Scroll Right Button -->
        <div
          x-show="canScrollRight"
          x-transition:enter="transition opacity duration-300"
          x-transition:enter-start="opacity-0"
          x-transition:enter-end="opacity-100"
          x-transition:leave="transition opacity duration-300"
          x-transition:leave-start="opacity-100"
          x-transition:leave-end="opacity-0"
          class="pointer-events-none absolute top-0 right-0 bottom-0 z-10 hidden w-32 items-center justify-end bg-gradient-to-l from-white via-white/90 to-transparent pr-4 sm:w-40 md:flex">
          <button
            @click="scrollRight()"
            type="button"
            aria-label="Przewiń kategorie w prawo"
            class="group pointer-events-auto flex h-9 w-9 items-center justify-center transition-transform duration-200 hover:scale-105">
            <img
              src="/src/assets/icons/icon-arrow.svg"
              alt=""
              class="h-9 w-9 rotate-45 invert transition-all duration-200 group-hover:opacity-80" />
          </button>
        </div>
      </div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
